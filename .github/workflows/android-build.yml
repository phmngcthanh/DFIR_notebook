name: Android build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: debug (adb-installable) or release (unsigned)
        required: true
        default: debug
        type: choice
        options: [debug, release]

permissions:
  contents: read

jobs:
  android-apk:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      # openssl-src's Android makefiles invoke GNU-prefixed binutils
      # (aarch64-linux-android-ranlib etc.) that NDK r23+ no longer ships;
      # shim them onto the LLVM equivalents.
      - name: Shim NDK binutils names for openssl
        run: |
          TOOLBIN="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in ranlib ar strip; do
            ln -sf "$TOOLBIN/llvm-$tool" "$TOOLBIN/aarch64-linux-android-$tool"
          done
          "$TOOLBIN/aarch64-linux-android-ranlib" --version | head -1

      - name: Install Rust target
        run: |
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-arm64

      - run: npm ci

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npx tauri android init

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          if [ "${{ inputs.build_profile }}" = "debug" ]; then
            npx tauri android build --apk --target aarch64 --debug
          else
            npx tauri android build --apk --target aarch64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dfir-investigator-android-${{ inputs.build_profile }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
